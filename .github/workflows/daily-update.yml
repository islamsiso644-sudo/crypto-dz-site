name: Daily Price Update

on:
  schedule:
    - cron: '0 6 * * *'   # يوميًا 06:00 UTC (≈ 07:00 بتوقيت الجزائر صيفًا)
  workflow_dispatch:        # يسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: write           # يسمح للبوت بالكوميت والنشر

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run auto publisher
        run: python3 auto_publisher.py

      - name: Commit and push if changed
        run: |
          git config user.name  "crypto-dz-bot"
          git config user.email "bot@crypto-dz.local"
          git add -A
          git diff --cached --quiet && echo "لا تغييرات اليوم — لا كوميت" || (git commit -m "آلي: تحديث تقرير الأسعار $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
